name: Release

# Cut a release by pushing a tag:  git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  desktop:
    name: Package desktop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make dist
      - uses: actions/upload-artifact@v4
        with:
          name: desktop
          path: dist/*.tar.gz
          if-no-files-found: error

  switch:
    name: Package .nro
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4
      - run: make PLATFORM=switch APP_VERSION="${GITHUB_REF_NAME#v}" dist
      - uses: actions/upload-artifact@v4
        with:
          name: switch
          path: dist/Battleship.nro
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [desktop, switch]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            artifacts/desktop/*.tar.gz \
            artifacts/switch/Battleship.nro
